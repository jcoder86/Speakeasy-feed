name: Daily feed curation

on:
  schedule:
    # 06:00 Europe/Amsterdam valt op 04:00 UTC (zomertijd/CEST) of 05:00 UTC (wintertijd/CET).
    # GitHub Actions cron-triggers lopen vaak fors achter op de geplande tijd, dus geen
    # strikte lokale-tijd-check meer: elke trigger draait gewoon. De pipeline is idempotent
    # (dedup op url, decay op basis van published_at), dus twee runs per dag is onschadelijk.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install -r requirements.txt

      - name: Haal bestaande feed.json op van gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages
            git show origin/gh-pages:feed.json > feed.json || echo "{}" > feed.json
          else
            echo "{}" > feed.json
          fi

      - name: Draai curatiepipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline.main

      - name: Commit bijgewerkte state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "chore: update seen-state [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Voorbereid publish-map
        run: |
          mkdir -p _site
          cp feed.json _site/feed.json

      - name: Publiceer feed.json naar gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
